# WSL 每次会话结束会停掉 multi-user/swap 目标，下一次会话再拉起 systemd；
# 持久 journal 在这种「非完整关机」下会被 journald 判定为 unclean，每次启动
# 打两条 "corrupted or uncleanly shut down" 到 dmesg。
#
# WSL 的 init-systemd 只等 10 秒就 reboot(RB_POWER_OFF)，无法保证 journald
# 做 final close；这是 WSL 宿主行为，不是内核问题。
#
# Storage=volatile 把 journal 放到 /run（tmpfs）：本次 boot 内 journalctl
# 仍可正常使用，VM/发行版重启后日志不保留；换来的是不再出现假损坏提示。
# 需要跨重启保留日志时，删除本文件并重启 systemd-journald。
[Journal]
Storage=volatile
RuntimeMaxUse=256M
