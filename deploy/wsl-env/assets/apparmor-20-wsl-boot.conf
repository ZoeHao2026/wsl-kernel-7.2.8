[Unit]
# Ubuntu 的 apparmor.service 自带 ConditionSecurity=apparmor。
# 在 WSL 冷启动中，这个条件会在 wsl-securityfs.service 挂载 securityfs
# 之前求值；一旦为 false，服务就被跳过，178 个 profile 不会加载。
# 这里清空条件/断言，改由 ExecStartPre 等待 securityfs 真正就绪。
ConditionSecurity=
AssertPathIsReadWrite=

[Service]
ExecStartPre=/bin/sh -c 'i=0; while [ ! -e /sys/kernel/security/apparmor/.load ] && [ $i -lt 100 ]; do i=$((i+1)); sleep 0.05; done; [ -e /sys/kernel/security/apparmor/.load ]'
