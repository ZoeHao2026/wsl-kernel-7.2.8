# WSL 的 init-systemd 只给 10 秒关机窗口（InitTerminateInstanceInternal）。
# Ubuntu 默认的 systemd DefaultTimeoutStopSec=90s，Docker/PostgreSQL/Redis 等
# 服务稍慢就会让 systemd 来不及退出，WSL 直接 reboot(RB_POWER_OFF) 硬关机；
# 实例可能停在「半终止」状态，下一次 wsl 命令报
#   Wsl/Service/E_UNEXPECTED（灾难性故障）
#
# 5 秒足够这些服务并行退出（本机实测关机 5–7 秒，不再出现
# "systemctl poweroff did not terminate"），又把总时间压在 10 秒窗口内。
# 超过 5 秒的服务会被 SIGKILL；数据库自身的崩溃恢复会处理（PostgreSQL 实测正常）。
#
# 需要更保守时可改成 8s，但 WSL 的 10 秒窗口内不一定能完成。
[Manager]
DefaultTimeoutStopSec=5s
DefaultTimeoutAbortSec=5s
