# ============================================================================
# zram / swap / 回写 的内核参数微调（配合 7.2.8 优化内核）
#
# 安装：
#   sudo install -d /etc/sysctl.d
#   sudo cp config/90-wsl-zram-sysctl.conf /etc/sysctl.d/90-wsl-zram-sysctl.conf
#   sudo sysctl --system
#
# 依据
# ----
# vm.swappiness=100
#   交换设备是 zram（压缩内存）时，Ubuntu 官方与 zram 上游都建议调高。命中
#   zram 只花一次内存内解压，比丢掉干净的页缓存再回读磁盘便宜得多；默认 60 是
#   为「机械盘交换」设计的。zram 未启用时该值不会造成伤害，因为内核仍优先回收
#   可直接释放的页。
#
# vm.page-cluster=0
#   交换读入一次只预读 1 页而不是 8 页（2^3）。zram 是随机访问设备，预读没有
#   收益，只白白多解压 7 页。
#
# vm.dirty_* —— 保持发行版默认，不在这里改
#   本机是 15 GiB 内存跑在动态 VHDX 上，脏页回写停顿比吞吐更值得避免；默认
#   ratio 20 / background 10 在 15 GiB 下已经是几个 GiB 的量级，改小反而更容易
#   触发同步回写。需要跑大文件写的场景请用 /mnt/c、/mnt/d 之外的路径，见
#   docs/FILESYSTEM-PERFORMANCE.md。
# ============================================================================
vm.swappiness = 100
vm.page-cluster = 0
